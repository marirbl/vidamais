<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meus agendamentos | Vida+</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-agendamentos">

    <!-- CABEÇALHO -->
    <header class="header-principal">

        <div class="logo-principal">
            <span>✚</span> Vida+
        </div>

        <nav class="menu-principal">
            <a href="index.html">Início</a>

            <a href="index.html#especialistas">
                Especialistas
            </a>

            <a href="meus-agendamentos.html" class="ativo">
                Meus agendamentos
            </a>

            <button id="btnSair" class="btn-sair">
                Sair
            </button>
        </nav>

    </header>


    <!-- CONTEÚDO -->
    <main class="agendamentos-page">

        <div class="agendamentos-container">

            <!-- TÍTULO -->
            <section class="agendamentos-topo">

                <span class="agendamentos-tag">
                    Minha área
                </span>

                <h2>
                    Meus agendamentos
                </h2>

                <p>
                    Consulte suas próximas consultas e gerencie

                <a
                    href="index.html#especialistas"
                    class="btn-novo-agendamento"
                >
                    + Agendar nova consulta
                </a>

            </section>


            <!-- LISTA -->
            <section class="area-lista-agendamentos">

                <div id="listaAgendamentos">

                    <p>
                        Carregando seus agendamentos...
                    </p>

                </div>

            </section>

        </div>

    </main>


    <!-- RODAPÉ -->
    <footer class="footer-principal">

        <div class="footer-logo">
            ✚ Vida+
        </div>

        <p>
            Vida+ — Cuidando da sua saúde.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
